name: CI/CD

on:
  push:
    branches: [clean-main]
  pull_request:
    branches: [clean-main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-test.txt
      - name: Run unit tests
        working-directory: backend
        run: pytest tests/test_auth_utils.py tests/test_models.py tests/test_utils.py tests/test_tutor_utils.py -v --tb=short

  integration-tests:
    runs-on: ubuntu-latest
    needs: unit-tests
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-test.txt
      - name: Run integration tests
        working-directory: backend
        env:
          JWT_SECRET: ci-test-secret
          MONGO_URI: mongodb://localhost:27017/
          MONGO_DB: lernytube_test
        run: pytest tests/test_api_auth.py tests/test_api_sessions.py tests/test_api_snapshots.py tests/test_api_tutor.py -v --tb=short

  deploy:
    runs-on: ubuntu-latest
    needs: integration-tests
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /docker/lernytube
            git pull
            docker compose up -d --build
